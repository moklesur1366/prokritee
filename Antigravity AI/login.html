<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prokritee Admin — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-grid {
      background-image: radial-gradient(circle, #064e3b22 1px, transparent 1px);
      background-size: 28px 28px;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-900 bg-grid flex items-center justify-center p-4">

  <div class="w-full max-w-sm">

    <!-- Logo & Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white shadow-xl border border-emerald-500/30 mb-4 overflow-hidden">
        <img src="assets/images/logo.jpg" alt="Prokritee Logo" class="w-full h-full object-contain p-1" onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden')">
        <i class="fa-solid fa-leaf text-emerald-600 text-3xl hidden"></i>
      </div>
      <h1 class="text-2xl font-black text-white tracking-tight">prokritee</h1>
      <p class="text-slate-400 text-sm mt-1">Admin Backend Panel</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8">

      <div class="mb-6">
        <h2 class="text-lg font-bold text-slate-900">Sign In</h2>
        <p class="text-xs text-slate-500 mt-0.5">Enter your credentials to access the admin dashboard</p>
      </div>

      <!-- Error Alert -->
      <div id="login-error" class="hidden mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700 font-medium flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation text-red-500"></i>
        <span id="login-error-text">Invalid username or password.</span>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Username</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-400 text-sm"></i>
            <input
              type="text"
              id="login-username"
              required
              autocomplete="username"
              placeholder="Enter your username"
              class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none bg-slate-50 focus:bg-white transition-colors"
            >
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1.5">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-sm"></i>
            <input
              type="password"
              id="login-password"
              required
              autocomplete="current-password"
              placeholder="Enter your password"
              class="w-full pl-10 pr-11 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-emerald-600 focus:outline-none bg-slate-50 focus:bg-white transition-colors"
            >
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-600">
              <i id="pw-toggle-icon" class="fa-solid fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="login-btn"
          class="w-full py-3 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl transition-all shadow-md shadow-emerald-700/20 flex items-center justify-center gap-2 text-sm"
        >
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
          <span id="login-btn-text">Sign In to Dashboard</span>
        </button>

      </form>

      <div class="mt-6 pt-5 border-t border-slate-100 text-center">
        <p class="text-[11px] text-slate-400">
          <i class="fa-solid fa-shield-halved text-emerald-500 mr-1"></i>
          Secure admin access · Prokritee Corporate Gifts
        </p>
      </div>

    </div>

    <!-- Default credentials hint (shown only in dev) -->
    <div id="default-hint" class="mt-4 px-4 py-3 bg-slate-800/60 border border-slate-700/50 rounded-2xl text-center">
      <p class="text-slate-400 text-[11px]">Default login: <span class="text-emerald-400 font-mono font-bold">admin</span> / <span class="text-emerald-400 font-mono font-bold">admin123</span></p>
      <p class="text-slate-600 text-[10px] mt-0.5">Change password after first login in Settings → User Management</p>
    </div>

  </div>

  <script>
    // If already logged in, redirect to admin
    async function checkAuth() {
      try {
        const res = await fetch('/api/auth-check');
        if (res.ok) {
          const data = await res.json();
          if (data.authenticated) {
            window.location.href = '/admin';
          }
        }
      } catch (e) {}
    }
    checkAuth();

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const btn      = document.getElementById('login-btn');
      const btnText  = document.getElementById('login-btn-text');
      const errEl    = document.getElementById('login-error');
      const errText  = document.getElementById('login-error-text');

      btn.disabled = true;
      btnText.textContent = 'Signing in...';
      errEl.classList.add('hidden');

      try {
        const res  = await fetch('/api/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.success) {
          btnText.textContent = 'Redirecting...';
          window.location.href = '/admin';
        } else {
          errText.textContent = data.error || 'Invalid username or password.';
          errEl.classList.remove('hidden');
          btn.disabled = false;
          btnText.textContent = 'Sign In to Dashboard';
        }
      } catch (err) {
        errText.textContent = 'Cannot connect to server. Make sure python3 server.py is running.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btnText.textContent = 'Sign In to Dashboard';
      }
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('login-password');
      const icon  = document.getElementById('pw-toggle-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-solid fa-eye-slash text-sm';
      } else {
        input.type = 'password';
        icon.className = 'fa-solid fa-eye text-sm';
      }
    }
  </script>
</body>
</html>
